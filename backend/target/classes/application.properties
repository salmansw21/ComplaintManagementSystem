spring.application.name=complaint-management-backend
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/complaint_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
